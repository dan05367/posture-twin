services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Taipei
    volumes:
      - ./mlflow_data:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/posture-classifier/latest
      FEEDBACK_DIR: /data/feedback
      HOME: /tmp
      TZ: Asia/Taipei
    volumes:
      - ./data/feedback:/data/feedback      # 使用者更正的標註（請先 mkdir -p data/feedback）
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  drift:
    build: ./services/drift
    ports:
      - "8001:8001"
    environment:
      API_URL: http://api:8000
      REFERENCE_PATH: /reference/reference.csv
      CHECK_INTERVAL_SEC: "30"
      DRIFT_FILTER_LABEL: good
      PSI_THRESHOLD: "0.2"
      TZ: Asia/Taipei
    volumes:
      - ./monitoring/reference:/reference:ro
    depends_on:
      - api
    restart: unless-stopped

  retrain:
    build:
      context: .
      dockerfile: services/retrain/Dockerfile
    ports:
      - "8002:8002"
    environment:
      TZ: Asia/Taipei
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_URL: http://api:8000
      DRIFT_URL: http://drift:8001
      DATA_DIRS: /data/raw,/data/feedback
      MIN_NEW_ROWS: "100"                  # 新增幾筆標註才重新訓練
      MIN_INTERVAL_SEC: "21600"            # 兩次訓練至少間隔 6 小時
      CHECK_INTERVAL_SEC: "600"
      # 通知管道（寫在 .env 檔裡，沒設定的就不會發送）
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
    volumes:
      - ./data:/data:ro
      - retrain_state:/state
    depends_on:
      mlflow:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - api
      - drift
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  retrain_state:
