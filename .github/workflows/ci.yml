name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install pytest
      - name: Test edge feature code (no camera needed)
        working-directory: edge
        run: pytest -q

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - name: Install
        working-directory: services/api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        working-directory: services/api
        run: pytest -q

  docker:
    needs: [test-edge, test-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          load: true
          tags: posture-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 posture-api:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep '"status":"ok"'
          curl -fsS -X POST http://localhost:8000/features \
            -H 'content-type: application/json' \
            -d '{"deviations":{"shoulder_tilt":0,"head_roll":0,"head_offset":0,"head_drop":-0.3,"shrug":0,"lean":1.0}}' \
            | grep '"label":"slouch"'

      - name: Show container logs on failure
        if: failure()
        run: docker logs api

      - name: Docker metadata
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
